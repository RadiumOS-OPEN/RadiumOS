# RadiumOS boot menu. `make` copies this file into the ISO; press `e` on an entry to edit its kernel
# command line (the words are listed in src/kernel/cmdline.h) and `c` for a GRUB command line.

# 1: always show the menu and count down from menu_timeout seconds.
# 0: boot straight away; hold Shift, Ctrl or Alt at power-on to get the menu.
set menu_always=1
set menu_timeout=5

set default=0
set fallback=1
insmod fat
insmod part_msdos
insmod keystatus
insmod reboot
insmod halt
insmod png
insmod vbe
insmod gfxterm
insmod gfxmenu
insmod video

if loadfont ($root)/boot/grub/fonts/unicode.pf2; then
  set gfxmode=800x600,auto
  terminal_output gfxterm
  background_image ($root)/boot/grub/splash.png
fi
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan
set color_normal=light-gray/black

if [ "$menu_always" = 1 ]; then
  set timeout="$menu_timeout"
else
  set timeout=0
fi

set show_menu=
if keystatus --shift; then set show_menu=1; fi
if keystatus --ctrl; then set show_menu=1; fi
if keystatus --alt; then set show_menu=1; fi
if [ -n "$show_menu" ]; then
  set timeout=-1
fi

# Prints a status line, but only when someone is looking at the menu.
function say {
  if [ "$menu_always" = 1 -o -n "$show_menu" ]; then
    echo "$*"
  fi
}

# Sets rdisk to the first of the first four hard disks that holds the file $1, as "(hdN)" (empty if none).
# (A device wildcard like (hd*) is not expanded without the regexp module, so the disks are listed.)
function find_disk_file {
  set rdisk=
  for d in hd0 hd1 hd2 hd3; do
    if [ -z "$rdisk" ]; then
      if [ -f "($d)/$1" ]; then
        set rdisk="($d)"
      fi
    fi
  done
}

# The updated kernel from /disk if there is one, else the built-in one. Arguments are kernel command line words.
function boot_radium {
  find_disk_file radium/kernel.bin
  if [ -n "$rdisk" ]; then
    say "Loading the updated kernel from $rdisk/radium/kernel.bin"
    multiboot "$rdisk/radium/kernel.bin" source=disk $*
  else
    say "Loading the built-in kernel"
    multiboot /boot/os.bin source=iso $*
  fi
  boot
}

function boot_builtin {
  say "Loading the built-in kernel"
  multiboot /boot/os.bin source=iso $*
  boot
}

# The updated kernel only: no silent switch to the built-in one when it is missing.
function boot_disk_only {
  find_disk_file radium/kernel.bin
  if [ -n "$rdisk" ]; then
    multiboot "$rdisk/radium/kernel.bin" source=disk $*
    boot
  else
    echo "There is no updated kernel on the disk. Run 'update apply' in RadiumOS first."
    sleep 5
  fi
}

# The kernel that the last update replaced.
function boot_previous {
  find_disk_file radium/kernel.old
  if [ -n "$rdisk" ]; then
    say "Loading the previous kernel from $rdisk/radium/kernel.old"
    multiboot "$rdisk/radium/kernel.old" source=old $*
    boot
  else
    echo "There is no previous kernel on the disk (it appears after the second update)."
    sleep 4
  fi
}

menuentry "RadiumOS" --hotkey=d {
  boot_radium
}

menuentry "RadiumOS (built-in kernel, ignore disk update)" --hotkey=b {
  boot_builtin
}

submenu "Advanced options for RadiumOS" --hotkey=a {
  menuentry "RadiumOS (rescue target: early boot units only)" --hotkey=r {
    boot_radium radium.target=rescue
  }
  menuentry "RadiumOS (safe mode: built-in kernel, no network, no startup script)" --hotkey=s {
    boot_builtin safe
  }
  menuentry "RadiumOS (verbose boot: command line and unit output)" --hotkey=v {
    boot_radium verbose
  }
  menuentry "RadiumOS (quiet boot: only failures)" --hotkey=q {
    boot_radium quiet
  }
  menuentry "RadiumOS (no network)" --hotkey=n {
    boot_radium nonet
  }
  menuentry "RadiumOS (no startup script)" --hotkey=c {
    boot_radium norc
  }
  menuentry "RadiumOS (fast boot: no splash, no waits)" --hotkey=f {
    boot_radium fastboot nosplash
  }
  menuentry "RadiumOS (graphical target)" --hotkey=g {
    boot_radium radium.target=graphical
  }
  menuentry "RadiumOS (previous kernel)" --hotkey=p {
    boot_previous
  }
  menuentry "RadiumOS (previous kernel, rescue target)" {
    boot_previous radium.target=rescue
  }
  menuentry "RadiumOS (built-in kernel, rescue target)" {
    boot_builtin radium.target=rescue
  }
  menuentry "RadiumOS (built-in kernel, verbose boot)" {
    boot_builtin verbose
  }
}

submenu "Updates and repair" --hotkey=u {
  menuentry "Show the kernels installed on the disk" --hotkey=i {
    set found=
    for d in hd0 hd1 hd2 hd3; do
      for k in kernel.bin kernel.old; do
        if [ -f "($d)/radium/$k" ]; then
          set found=1
          ls -l "($d)/radium/$k"
        fi
      done
    done
    if [ -z "$found" ]; then
      echo "No kernel is installed on the disk: the built-in kernel boots."
    fi
    echo ""
    echo "Built-in kernel:"
    ls -l /boot/os.bin
    echo ""
    sleep --verbose --interruptible 30
  }
  menuentry "Boot the updated kernel only (no fallback)" --hotkey=k {
    boot_disk_only
  }
  menuentry "Repair: boot the built-in kernel and reinstall the update package" --hotkey=r {
    boot_builtin autoupdate
  }
  menuentry "Repair: boot the built-in kernel and remove the updated kernel from the disk" --hotkey=x {
    boot_builtin autorollback
  }
}

menuentry "Reboot" {
  reboot
}

menuentry "Power off" {
  halt
}
